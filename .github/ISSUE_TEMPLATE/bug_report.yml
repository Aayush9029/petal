name: Bug report
description: Report a reproducible problem with Petal
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Petal. Please search existing issues before filing a new report. For security vulnerabilities, use the private reporting link instead of this form.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open Petal
        2. Select ...
        3. Start ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include enough information to reproduce the issue.
      placeholder: |
        - Petal version:
        - macOS version:
        - Mac model and chip:
        - Transcription model/provider:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Add relevant logs, screenshots, or recordings. Remove transcripts, credentials, and other private data first.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed sensitive or personal information from anything I attached.
          required: true
